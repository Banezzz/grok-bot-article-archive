<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{TITLE}}</title>
  <style>
    /* Theme tokens must stay aligned with LIGHT_VARS / DARK_VARS in src/pages.ts.
       Honor html[data-theme] from the archive chrome; fall back to prefers-color-scheme. */
    :root {
      color-scheme: light;
      --bg: #f3f0e8;
      --fg: #1a1814;
      --muted: #6b645a;
      --card: #fffdf8;
      --border: #e4ddd0;
      --accent: #0c6a52;
      --link: var(--accent);
      --panel: var(--card);
    }
    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #12100e;
        --fg: #f4efe6;
        --muted: #b3aaa0;
        --card: #1d1a16;
        --border: #3b342c;
        --accent: #86d4b0;
        --link: var(--accent);
        --panel: var(--card);
      }
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #12100e;
      --fg: #f4efe6;
      --muted: #b3aaa0;
      --card: #1d1a16;
      --border: #3b342c;
      --accent: #86d4b0;
      --link: var(--accent);
      --panel: var(--card);
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f3f0e8;
      --fg: #1a1814;
      --muted: #6b645a;
      --card: #fffdf8;
      --border: #e4ddd0;
      --accent: #0c6a52;
      --link: var(--accent);
      --panel: var(--card);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--fg);
      background: var(--bg);
      font: 16px/1.7 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 36px 0 72px; }
    header.meta { margin-bottom: 30px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
    header.meta h1 { margin: 0 0 10px; font-size: clamp(1.6rem, 4vw, 2.15rem); line-height: 1.25; letter-spacing: -0.02em; }
    header.meta p { margin: 5px 0; color: var(--muted); font-size: 0.93rem; }
    a { color: var(--link); }
    article h2, article h3 { line-height: 1.3; margin-top: 1.8em; }
    .pair { margin: 1.45em 0; }
    .pair .zh { margin: 0 0 0.45em; }
    .pair .en { margin: 0; color: var(--muted); }
    blockquote { margin: 1.4em 0; padding: 0.2em 1em; border-left: 3px solid var(--border); color: var(--muted); }
    pre { overflow-x: auto; padding: 14px; border-radius: 8px; background: var(--panel); border: 1px solid var(--border); }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    figure { margin: 1.7em 0; }
    figure img { display: block; max-width: 100%; height: auto; margin: 0 auto; border-radius: 8px; }
    figcaption { margin-top: 8px; color: var(--muted); font-size: 0.88rem; text-align: center; }
    .gap { margin: 1.25em 0; padding: 12px 14px; border: 1px dashed var(--border); border-radius: 8px; color: var(--muted); font-size: 0.9rem; }
    .tweet-card { margin: 1.4em 0; padding: 0.2em 1em; border-left: 3px solid var(--border); }
    /* The live /a/:slug view injects html[data-content-lang=zh|en|both], hide/show CSS,
       and a content-language control under the title. Mark every language-specific block. */
  </style>
</head>
<body>
  <main>
    <header class="meta">
      <h1>{{TITLE}}</h1>
      <p>{{AUTHOR}} · <time datetime="{{PUBLISHED_AT}}">{{PUBLISHED_AT_LABEL}}</time></p>
      <p><a href="{{SOURCE_URL}}" rel="noreferrer noopener">Source / 原文</a></p>
    </header>

    <article>
      <!-- Repeat .pair blocks. Always Chinese first, then the matching English source.
           Mark each language-specific block with class zh|en AND lang="zh"|"en".
           The article header can then show 中文 / English / 中英对照. -->
      <section class="pair">
        <p class="zh" lang="zh">{{PARAGRAPH_ZH}}</p>
        <p class="en" lang="en">{{PARAGRAPH_EN}}</p>
      </section>

      <!-- Language-specific headings use the same pair + zh/en marks. -->
      <section class="pair">
        <h2 class="zh" lang="zh">{{HEADING_ZH}}</h2>
        <h2 class="en" lang="en">{{HEADING_EN}}</h2>
      </section>

      <!-- Put each figure beside the paragraph or section it illustrates.
           Keep the image unmarked so every reading mode still shows it.
           If the caption is bilingual, mark each line (or span) separately. -->
      <figure>
        <img src="{{IMAGE_DATA_URI}}" alt="{{IMAGE_ALT}}">
        <figcaption>
          <span class="zh" lang="zh">{{IMAGE_CAPTION_ZH}}</span>
          <span class="en" lang="en">{{IMAGE_CAPTION_EN}}</span>
        </figcaption>
      </figure>

      <!-- Quoted tweet / card: same Chinese-then-English marks inside the card. -->
      <blockquote class="tweet-card">
        <p class="zh" lang="zh">{{TWEET_ZH}}</p>
        <p class="en" lang="en">{{TWEET_EN}}</p>
      </blockquote>

      <!-- Unmarked pre/code, tables, and figures stay visible in every language mode. -->
      <!-- Repeat headings, lists, quotations, code blocks, pairs, and figures as needed. -->
      <!-- If an image failed after documented retries, insert a visible .gap notice here. -->
      <p class="gap" role="note">{{GAP_NOTICE_OR_REMOVE_THIS_PARAGRAPH}}</p>
    </article>
  </main>
</body>
</html>
